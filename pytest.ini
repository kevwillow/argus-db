[pytest]
testpaths = tests
addopts = --strict-markers

# Resource-availability markers. A test declares what it needs from the
# environment; conftest.py turns a missing resource into a skip -- or, under
# ARGUS_REQUIRE_ALL=1, into a loud collection-time failure.
#
# `public` is the complement of the other two and is APPLIED BY conftest.py's
# pytest_collection_modifyitems, not by hand: every item that declares neither
# canonical_db nor raw_artifacts gets it. So `-m public` selects exactly the
# subset the public-suite workflow proves green on a resource-free checkout,
# and the label cannot drift out of step with the resource markers as tests are
# added. Writing it by hand on an item that also declares a resource is a
# contradiction and fails collection.
markers =
    public: passes on a fresh public clone with no undistributed resources (computed by conftest.py; select with -m public).
    canonical_db: requires db/argus.db (NOT distributed).
    raw_artifacts: requires the undistributed extraction inputs -- the raw/ tree AND extraction_outputs/mac321_v166/raw/fcc_grantee_full.json, which .gitignore's raw/ rule also matches.
